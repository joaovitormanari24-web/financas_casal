name: financas_casal
description: Aplicativo de finanças pessoais para o casal — entender hoje para gastar melhor amanhã.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend / dados
  supabase_flutter: ^2.6.0

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegação
  go_router: ^14.2.0

  # Design / animação
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0
  lottie: ^3.1.2

  # Formatação BR (moeda, datas)
  intl: ^0.20.3

  # Utilitários
  equatable: ^2.0.5
  uuid: ^4.4.2
  collection: ^1.18.0

  # Preferências locais / cache leve
  shared_preferences: ^2.2.3

  # Segurança / biometria (arquitetura pronta para V2)
  local_auth: ^2.3.0

  # Configuração de ambiente
  flutter_dotenv: ^5.1.0

  # Ícones
  cupertino_icons: ^1.0.8

  # Comprovantes (foto/galeria)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/lottie/
