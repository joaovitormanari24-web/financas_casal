<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Sem isso, celulares renderizam a página numa largura virtual de
    desktop (~980px) e só ajustam a escala de verdade depois que o
    Flutter assume e injeta a própria tag — a logo da splash aparecia
    minúscula por um instante e "saltava" pro tamanho certo.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Finanças do casal, sem complicação.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Finanças inteligentes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Finanças inteligentes</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { overscroll-behavior-y: contain; }
  </style>
</head>
<body>
  <div id="app-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;background:#FAFAF8;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;z-index:999999;
      transition:opacity .3s ease;">
    <img src="logo.png" alt="" style="width:108px;height:108px;" />
    <div style="width:160px;height:4px;background:#E4E2DD;border-radius:999px;
        overflow:hidden;margin-top:22px;">
      <div id="app-loading-bar" style="height:100%;width:0%;background:#1F6F5C;
          border-radius:999px;transition:width .25s ease;"></div>
    </div>
    <div id="app-loading-slow" style="display:none;margin-top:28px;text-align:center;
        max-width:300px;padding:0 20px;">
      <div style="font-size:13px;color:#6B6E6B;margin-bottom:14px;">
        Isso está demorando mais que o normal. Sua conexão pode estar lenta.
      </div>
      <button onclick="location.reload()" style="padding:10px 22px;border-radius:999px;
          border:none;background:#1A1D1B;color:#FAFAF8;font-size:14px;font-weight:600;">
        Recarregar
      </button>
      <div id="app-loading-log" style="margin-top:18px;font-size:10px;color:#A1A39F;
          font-family:monospace;white-space:pre-wrap;text-align:left;"></div>
    </div>
  </div>
  <script>
    (function() {
      var errors = [];
      window.addEventListener('error', function(e) {
        errors.push((e.message || e) + (e.filename ? (' @ ' + e.filename.split('/').pop() + ':' + e.lineno) : ''));
      });
      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        errors.push('rejection: ' + (r && r.toString ? r.toString() : r));
      });

      // Barra de progresso "falsa" — não dá pra medir o carregamento real do
      // Dart/CanvasKit de forma confiável, então ela vai enchendo aos poucos
      // e se aproximando de 90% (sem nunca chegar lá) enquanto carrega de
      // verdade, e só completa os 100% quando o primeiro frame do Flutter
      // aparece de fato.
      var bar = document.getElementById('app-loading-bar');
      var progress = 0;
      var progressTimer = setInterval(function() {
        progress += (90 - progress) * 0.1;
        if (bar) bar.style.width = progress + '%';
      }, 200);

      // Tempo mínimo de exibição da splash — em conexões rápidas o app
      // carrega tão depressa que a logo mal aparecia; segura pelo menos
      // esse tanto antes de esconder, mesmo se o Flutter já estiver pronto.
      var loadStartedAt = Date.now();
      var minSplashMs = 1800;

      function hideSplash() {
        clearInterval(progressTimer);
        if (bar) bar.style.width = '100%';
        var el = document.getElementById('app-loading');
        if (el) {
          setTimeout(function() {
            el.style.opacity = '0';
            setTimeout(function() { el.remove(); }, 300);
          }, 150);
        }
      }

      window.addEventListener('flutter-first-frame', function() {
        var elapsed = Date.now() - loadStartedAt;
        var remaining = minSplashMs - elapsed;
        if (remaining > 0) {
          setTimeout(hideSplash, remaining);
        } else {
          hideSplash();
        }
      });
      setTimeout(function() {
        var loading = document.getElementById('app-loading');
        var slow = document.getElementById('app-loading-slow');
        if (loading && slow) {
          slow.style.display = 'block';
          document.getElementById('app-loading-log').textContent =
              errors.length ? errors.join('\n') : ('sem erros; crossOriginIsolated=' + window.crossOriginIsolated);
        }
      }, 15000);
    })();
  </script>
  <script>
    // Auto-update: compara o ETag de "/" com o que carregou nesta sessão.
    // Roda ao voltar de segundo plano (essencial em PWA "Adicionar à Tela de
    // Início" no iOS, que pode ficar suspenso por dias sem checar nada) e
    // periodicamente enquanto o app está em primeiro plano.
    (function() {
      var currentEtag = null;

      function checkForUpdate() {
        fetch(window.location.pathname, { cache: 'no-store', method: 'HEAD' })
          .then(function(res) {
            var etag = res.headers.get('etag');
            if (!etag) return;
            if (currentEtag === null) {
              currentEtag = etag;
              return;
            }
            if (etag !== currentEtag) {
              window.location.reload();
            }
          })
          .catch(function() {});
      }

      checkForUpdate();
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') checkForUpdate();
      });
      setInterval(checkForUpdate, 60000);

      // iOS "Adicionar à Tela de Início": reabrir o app às vezes restaura
      // uma foto congelada da página (bfcache) em vez de recarregar de
      // verdade — nesse caso nem o JS acima chega a rodar de novo a tempo.
      // event.persisted avisa quando isso aconteceu; força reload.
      window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
          window.location.reload();
        }
      });
    })();
  </script>
  <script>
    // Ponte pra notificações push — service worker próprio, num escopo
    // separado do service worker do Flutter (que só cuida de cache/PWA).
    (function() {
      function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var rawData = atob(base64);
        var outputArray = new Uint8Array(rawData.length);
        for (var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
        return outputArray;
      }

      window.FinancasPush = {
        isSupported: function() {
          return 'serviceWorker' in navigator && 'PushManager' in window;
        },
        register: async function(vapidPublicKey) {
          if (!window.FinancasPush.isSupported()) throw new Error('unsupported');
          var reg = await navigator.serviceWorker.register('push-sw.js', { scope: '/push-sw-scope/' });
          var permission = await Notification.requestPermission();
          if (permission !== 'granted') throw new Error('denied');
          var existing = await reg.pushManager.getSubscription();
          var sub = existing || await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
          });
          return JSON.stringify(sub.toJSON());
        },
        unregister: async function() {
          if (!window.FinancasPush.isSupported()) return;
          var reg = await navigator.serviceWorker.getRegistration('/push-sw-scope/');
          if (!reg) return;
          var sub = await reg.pushManager.getSubscription();
          if (sub) await sub.unsubscribe();
        },
        currentEndpoint: async function() {
          if (!window.FinancasPush.isSupported()) return null;
          var reg = await navigator.serviceWorker.getRegistration('/push-sw-scope/');
          if (!reg) return null;
          var sub = await reg.pushManager.getSubscription();
          return sub ? sub.endpoint : null;
        },
      };
    })();
  </script>
  <script>
    // Ponte pra Face ID/Touch ID/Windows Hello via WebAuthn — usada só como
    // destravamento local do bloqueio por PIN (não troca o login da conta).
    // Sem verificação de assinatura no servidor: o único valor de segurança
    // aqui é o próprio navegador ter exigido a biometria pra devolver
    // qualquer resultado, o mesmo nível de confiança que o PIN local já
    // tinha (ver app_lock_provider.dart).
    (function() {
      function toBase64(bytes) {
        var binary = '';
        var arr = new Uint8Array(bytes);
        for (var i = 0; i < arr.length; i++) binary += String.fromCharCode(arr[i]);
        return btoa(binary);
      }
      function fromBase64(base64) {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      window.FinancasBiometric = {
        isSupported: async function() {
          if (!window.PublicKeyCredential ||
              !PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
            return false;
          }
          try {
            return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          } catch (e) {
            return false;
          }
        },
        register: async function() {
          var credential = await navigator.credentials.create({
            publicKey: {
              challenge: crypto.getRandomValues(new Uint8Array(32)),
              rp: { name: 'Finanças inteligentes' },
              user: {
                id: crypto.getRandomValues(new Uint8Array(16)),
                name: 'app-lock',
                displayName: 'Desbloqueio do app',
              },
              pubKeyCredParams: [
                { alg: -7, type: 'public-key' },
                { alg: -257, type: 'public-key' },
              ],
              authenticatorSelection: {
                authenticatorAttachment: 'platform',
                userVerification: 'required',
              },
              timeout: 60000,
            },
          });
          if (!credential) throw new Error('no_credential');
          return toBase64(credential.rawId);
        },
        authenticate: async function(credentialIdBase64) {
          var assertion = await navigator.credentials.get({
            publicKey: {
              challenge: crypto.getRandomValues(new Uint8Array(32)),
              allowCredentials: [{
                id: fromBase64(credentialIdBase64),
                type: 'public-key',
                transports: ['internal'],
              }],
              userVerification: 'required',
              timeout: 60000,
            },
          });
          return !!assertion;
        },
      };
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
