<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="financas_casal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>financas_casal</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { overscroll-behavior-y: contain; }
  </style>
</head>
<body>
  <div id="app-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;background:#FAFAF8;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;z-index:999999;
      transition:opacity .3s ease;">
    <div style="width:36px;height:36px;border:3px solid #E4E2DD;border-top-color:#1F6F5C;
        border-radius:50%;animation:app-spin .8s linear infinite;"></div>
    <div style="margin-top:16px;font-size:15px;color:#6B6E6B;">Carregando…</div>
    <div id="app-loading-slow" style="display:none;margin-top:28px;text-align:center;
        max-width:300px;padding:0 20px;">
      <div style="font-size:13px;color:#6B6E6B;margin-bottom:14px;">
        Isso está demorando mais que o normal. Sua conexão pode estar lenta.
      </div>
      <button onclick="location.reload()" style="padding:10px 22px;border-radius:999px;
          border:none;background:#1A1D1B;color:#FAFAF8;font-size:14px;font-weight:600;">
        Recarregar
      </button>
      <div id="app-loading-log" style="margin-top:18px;font-size:10px;color:#A1A39F;
          font-family:monospace;white-space:pre-wrap;text-align:left;"></div>
    </div>
  </div>
  <style>@keyframes app-spin { to { transform: rotate(360deg); } }</style>
  <script>
    (function() {
      var errors = [];
      window.addEventListener('error', function(e) {
        errors.push((e.message || e) + (e.filename ? (' @ ' + e.filename.split('/').pop() + ':' + e.lineno) : ''));
      });
      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        errors.push('rejection: ' + (r && r.toString ? r.toString() : r));
      });
      window.addEventListener('flutter-first-frame', function() {
        var el = document.getElementById('app-loading');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function() { el.remove(); }, 300);
        }
      });
      setTimeout(function() {
        var loading = document.getElementById('app-loading');
        var slow = document.getElementById('app-loading-slow');
        if (loading && slow) {
          slow.style.display = 'block';
          document.getElementById('app-loading-log').textContent =
              errors.length ? errors.join('\n') : ('sem erros; crossOriginIsolated=' + window.crossOriginIsolated);
        }
      }, 15000);
    })();
  </script>
  <script>
    // Auto-update: compara o ETag de "/" com o que carregou nesta sessão.
    // Roda ao voltar de segundo plano (essencial em PWA "Adicionar à Tela de
    // Início" no iOS, que pode ficar suspenso por dias sem checar nada) e
    // periodicamente enquanto o app está em primeiro plano.
    (function() {
      var currentEtag = null;

      function checkForUpdate() {
        fetch(window.location.pathname, { cache: 'no-store', method: 'HEAD' })
          .then(function(res) {
            var etag = res.headers.get('etag');
            if (!etag) return;
            if (currentEtag === null) {
              currentEtag = etag;
              return;
            }
            if (etag !== currentEtag) {
              window.location.reload();
            }
          })
          .catch(function() {});
      }

      checkForUpdate();
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') checkForUpdate();
      });
      setInterval(checkForUpdate, 60000);

      // iOS "Adicionar à Tela de Início": reabrir o app às vezes restaura
      // uma foto congelada da página (bfcache) em vez de recarregar de
      // verdade — nesse caso nem o JS acima chega a rodar de novo a tempo.
      // event.persisted avisa quando isso aconteceu; força reload.
      window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
          window.location.reload();
        }
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
